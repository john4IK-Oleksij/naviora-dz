{% extends "base.html" %}

{% block content %}
<section class="contacts">
    <div class="contacts__container">
        <div class="contacts__intro">
            <p class="contacts__subtitle">GET IN TOUCH</p>
            <h1 class="contacts__title">Contact us</h1>
            <p class="contacts__text">
                Have a question about one of our tours?
                Send us a message and we will get back to you.</p>
            <div class="contacts__info">
                <div class="contacts__item">
                    <h2 class="contacts__item-title">Email</h2>
                    <a class="contacts__item-link"
                        href="mailto:hello@naviora.com">
                        hello@naviora.com</a>
                </div>
                <div class="contacts__item">
                    <h2 class="contacts__item-title">Phone</h2>
                    <a class="contacts__item-link"
                        href="tel:+48123456789">
                        +48 123 456 789</a>
                </div>
            </div>
        </div>
        <form
            class="contacts__form"
            method="post"
            action="/contacts">
            {% if message_sent %}
    <p class="contacts__success">
        Message sent successfully!
    </p>
{% endif %}
            <div class="contacts__group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your name"
                    required>
            </div>
            <div class="contacts__group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="your@email.com"
                    required>
            </div>
            <div class="contacts__group">
                <label for="phone">Phone</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+48 123 456 789">
            </div>
            <div class="contacts__group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Write your message..."
                    required></textarea>
            </div>
            <button
                class="contacts__button"
                type="submit">
                Send Message
            </button>
        </form>
    </div>
</section>
{% endblock %}
